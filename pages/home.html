<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6 text-center">
        <h1 class="mb-4">You are logged in!</h1>
        <div id="alert" class="d-none mb-4"></div>
        <p id="apiMessage" class="lead mb-4">Loading...</p>
        <button id="logoutBtn" class="btn btn-danger">Logout</button>
      </div>
    </div>
  </div>

  <script>
    const alertEl = document.getElementById("alert");

    function showAlert(message, type) {
      alertEl.className = `alert alert-${type}`;
      alertEl.textContent = message;
      alertEl.classList.remove("d-none");
    }

    async function loadMessage() {
      try {
        const res = await fetch("/api/home");
        const data = await res.json();

        if (!res.ok) {
          showAlert(data.error, "danger");
          document.getElementById("apiMessage").textContent = "";
          return;
        }

        document.getElementById("apiMessage").textContent = data.message;
      } catch {
        showAlert("Failed to load home message.", "danger");
        document.getElementById("apiMessage").textContent = "";
      }
    }

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      try {
        const res = await fetch("/auth/logout", { method: "POST" });
        const data = await res.json();

        if (!res.ok) {
          showAlert(data.error, "danger");
          return;
        }

        showAlert(data.message, "success");
        setTimeout(() => {
          window.location.href = "login.html";
        }, 2000);
      } catch {
        showAlert("Something went wrong. Please try again.", "danger");
      }
    });

    loadMessage();
  </script>
</body>
</html>
