<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <h1 class="mb-4">Login</h1>
        <div id="alert" class="d-none"></div>
        <form id="loginForm">
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" required>
            <div id="emailError" class="text-danger small d-none"></div>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" required>
            <div id="passwordError" class="text-danger small d-none"></div>
          </div>
          <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
        <p class="mt-3 text-center">Don't have an account? <a href="register.html">Register</a></p>
      </div>
    </div>
  </div>

  <script>
    const alertEl = document.getElementById("alert");

    function showAlert(message, type) {
      alertEl.className = `alert alert-${type}`;
      alertEl.textContent = message;
      alertEl.classList.remove("d-none");
    }

    function clearErrors() {
      alertEl.classList.add("d-none");
      document.getElementById("emailError").classList.add("d-none");
      document.getElementById("passwordError").classList.add("d-none");
    }

    function showFieldErrors(errors) {
      if (errors.email) {
        const el = document.getElementById("emailError");
        el.textContent = errors.email.errors.join(", ");
        el.classList.remove("d-none");
      }
      if (errors.password) {
        const el = document.getElementById("passwordError");
        el.textContent = errors.password.errors.join(", ");
        el.classList.remove("d-none");
      }
    }

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      clearErrors();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        const res = await fetch("/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });

        const data = await res.json();

        if (!res.ok) {
          if (data.errors) {
            showFieldErrors(data.errors);
          } else {
            showAlert(data.error, "danger");
          }
          return;
        }

        showAlert(data.message, "success");
        setTimeout(() => {
          window.location.href = "home.html";
        }, 2000);
      } catch {
        showAlert("Something went wrong. Please try again.", "danger");
      }
    });
  </script>
</body>
</html>
