<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <h1 class="mb-4">Register</h1>
        <div id="alert" class="d-none"></div>
        <form id="registerForm">
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" required>
            <div id="usernameError" class="text-danger small d-none"></div>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" required>
            <div id="emailError" class="text-danger small d-none"></div>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" required>
            <div id="passwordError" class="text-danger small d-none"></div>
          </div>
          <div class="mb-3">
            <label for="password_confirmation" class="form-label">Confirm Password</label>
            <input type="password" class="form-control" id="password_confirmation" required>
            <div id="password_confirmationError" class="text-danger small d-none"></div>
          </div>
          <button type="submit" class="btn btn-primary w-100">Register</button>
        </form>
        <p class="mt-3 text-center">Already have an account? <a href="login.html">Login</a></p>
      </div>
    </div>
  </div>

  <script>
    const alertEl = document.getElementById("alert");

    function showAlert(message, type) {
      alertEl.className = `alert alert-${type}`;
      alertEl.textContent = message;
      alertEl.classList.remove("d-none");
    }

    function clearErrors() {
      alertEl.classList.add("d-none");
      ["username", "email", "password", "password_confirmation"].forEach((field) => {
        document.getElementById(field + "Error").classList.add("d-none");
      });
    }

    function showFieldErrors(errors) {
      Object.keys(errors).forEach((field) => {
        const el = document.getElementById(field + "Error");
        if (el) {
          el.textContent = errors[field].errors.join(", ");
          el.classList.remove("d-none");
        }
      });
    }

    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      clearErrors();

      const username = document.getElementById("username").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const password_confirmation = document.getElementById("password_confirmation").value;

      try {
        const res = await fetch("/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, email, password, password_confirmation }),
        });

        const data = await res.json();

        if (!res.ok) {
          if (data.errors) {
            showFieldErrors(data.errors);
          } else {
            showAlert(data.error, "danger");
          }
          return;
        }

        showAlert(data.message, "success");
        setTimeout(() => {
          window.location.href = "login.html";
        }, 2000);
      } catch {
        showAlert("Something went wrong. Please try again.", "danger");
      }
    });
  </script>
</body>
</html>
